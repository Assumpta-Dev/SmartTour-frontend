<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Tourism Guide</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #fff; font-family: sans-serif; }

      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #fff;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-ring {
        width: 44px; height: 44px;
        border: 4px solid #dbeafe;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      .loader-text {
        font-size: 13px; font-weight: 600;
        color: #3b82f6; letter-spacing: 0.05em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading screen — visible before React mounts -->
    <div id="app-loader">
      <div class="loader-ring"></div>
      <span class="loader-text">Smart Tourism</span>
    </div>

    <div id="root"></div>

    <script>
      // Hide loader as soon as React has rendered
      window.__hideLoader = function () {
        var el = document.getElementById('app-loader');
        if (!el) return;
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 350);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
