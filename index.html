<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
    <title>Smart Tourism Guide</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #fff; font-family: sans-serif; }

      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #fff;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-ring {
        width: 44px; height: 44px;
        border: 4px solid #fef08a;
        border-top-color: #eab308;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      .loader-text {
        font-size: 13px; font-weight: 700;
        color: #1e293b; letter-spacing: 0.08em;
        text-transform: uppercase;
        animation: fadeText 1.4s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeText {
        0%, 45%  { opacity: 1; }
        50%, 95% { opacity: 0; }
        100%     { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen — visible before React mounts -->
    <div id="app-loader">
      <div class="loader-ring"></div>
      <span class="loader-text" id="loader-label">Smart Tour Rwanda</span>
    </div>

    <div id="root"></div>

    <script>
      // Cycle loader text between two phrases
      var loaderTexts = ['Smart Tour Rwanda', 'Explore Your Destination'];
      var loaderIdx = 0;
      var loaderLabel = document.getElementById('loader-label');
      var loaderInterval = setInterval(function() {
        loaderIdx = (loaderIdx + 1) % loaderTexts.length;
        loaderLabel.textContent = loaderTexts[loaderIdx];
      }, 1400);

      var loaderStart = Date.now();
      var MIN_SHOW = 5000;

      window.__hideLoader = function () {
        var elapsed = Date.now() - loaderStart;
        var remaining = Math.max(0, MIN_SHOW - elapsed);
        setTimeout(function () {
          clearInterval(loaderInterval);
          var el = document.getElementById('app-loader');
          if (!el) return;
          el.classList.add('hidden');
          setTimeout(function () { el.remove(); }, 350);
        }, remaining);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
